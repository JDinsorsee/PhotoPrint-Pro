<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags สำหรับการแสดงผลเมื่อแชร์ลิงก์ (แนะนำให้มีเมื่อลง GitHub) -->
    <meta name="description" content="ระบบถ่ายรูปติดบัตรผู้พิการออนไลน์ด้วย AI พร้อมระบบลบพื้นหลังอัตโนมัติ">
    <title>ระบบถ่ายรูปติดบัตร AI - Pink Compact Edition</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- MediaPipe Selfie Segmentation สำหรับระบบ AI ลบพื้นหลัง -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #fff1f2;
            height: 100vh;
            overflow: hidden; /* ล็อกหน้าจอถาวรเพื่อให้พอดีกับ Viewport */
            display: flex;
            flex-direction: column;
            padding: 10px;
        }
        .pink-gradient {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
        }
        .panel-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 2px 10px -3px rgba(236, 72, 153, 0.15);
            border: 1px solid #fce7f3;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            padding: 12px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 133.33%; /* สัดส่วน 3:4 */
            background: #2d1a24;
            border-radius: 0.75rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .video-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        #outputCanvas {
            width: 100%; height: 100%; object-fit: cover;
        }
        .face-guide {
            position: absolute;
            top: 45%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50%; height: 55%;
            border: 2px dashed rgba(244, 114, 182, 0.5);
            border-radius: 50% 50% 45% 45%;
            pointer-events: none;
            z-index: 10;
        }
        .preview-box {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff5f7;
            border-radius: 0.75rem;
            border: 2px dashed #f9a8d4;
            overflow: hidden;
            position: relative;
        }
        #imageResult {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        .btn-active {
            outline: 3px solid #ec4899;
            transform: scale(1.02);
        }
        #webcam { display: none; }
        
        /* Effect ตอนกดถ่ายรูป */
        #flash {
            position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 50;
        }
        .animate-flash { animation: flash-anim 0.3s ease-out; }
        @keyframes flash-anim { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* การปรับแต่ง Slider ให้เป็นธีมชมพู */
        input[type=range] {
            height: 6px;
            -webkit-appearance: none;
            background: #ffe4e6;
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px; width: 16px;
            border-radius: 50%; background: #ec4899;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #ec4899;
            margin-bottom: 8px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Header ส่วนหัวของระบบ -->
    <header class="flex justify-between items-center bg-white p-2 mb-2 rounded-xl shadow-sm border border-pink-100">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 pink-gradient rounded-lg flex items-center justify-center text-white">
                <i class="fas fa-camera text-sm"></i>
            </div>
            <h1 class="font-bold text-gray-800 text-sm">ระบบถ่ายรูป AI ติดบัตร</h1>
        </div>
        <div id="cameraStatus" class="text-[9px] font-bold px-3 py-1 bg-pink-50 text-pink-600 rounded-full border border-pink-100">
            <i class="fas fa-spinner fa-spin mr-1"></i> เตรียมระบบ...
        </div>
    </header>

    <!-- หน้าจอหลักแบ่งเป็น 3 คอลัมน์ -->
    <main class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-3 min-h-0">
        
        <!-- คอลัมน์ที่ 1: กล้องถ่ายรูปสด -->
        <section class="panel-card">
            <h2 class="section-title"><i class="fas fa-video mr-2"></i> 1. กล้อง</h2>
            <div class="video-wrapper">
                <div class="video-content">
                    <div id="flash"></div>
                    <video id="webcam" autoplay playsinline></video>
                    <canvas id="outputCanvas"></canvas>
                    <div class="face-guide"></div>
                </div>
            </div>
            <div class="mt-2">
                <button id="snapBtn" class="w-full bg-pink-500 hover:bg-pink-600 text-white py-2.5 rounded-lg font-bold text-xs shadow-md transition-all active:scale-95 flex items-center justify-center">
                    <i class="fas fa-camera mr-2"></i> ถ่ายรูปตอนนี้
                </button>
                <button id="retakeBtn" class="w-full bg-pink-50 hover:bg-pink-100 text-pink-600 py-2.5 rounded-lg font-bold text-xs hidden flex items-center justify-center">
                    <i class="fas fa-redo mr-2"></i> ถ่ายใหม่
                </button>
            </div>
        </section>

        <!-- คอลัมน์ที่ 2: การปรับแต่งพื้นหลัง แสง และขนาดรูป -->
        <section class="panel-card">
            <h2 class="section-title"><i class="fas fa-sliders-h mr-2"></i> 2. ปรับแต่ง & ขนาด</h2>
            <div class="flex-1 overflow-y-auto space-y-4 pr-1">
                
                <!-- เลือกสีพื้นหลัง -->
                <div>
                    <label class="text-[9px] font-bold text-gray-400 mb-2 block uppercase">สีพื้นหลัง</label>
                    <div id="bgOptions" class="grid grid-cols-5 gap-1.5">
                        <button onclick="changeBg('#003399', this)" class="aspect-square rounded-md bg-[#003399] border-2 border-white shadow-sm btn-active"></button>
                        <button onclick="changeBg('#3399ff', this)" class="aspect-square rounded-md bg-[#3399ff] border-2 border-white shadow-sm"></button>
                        <button onclick="changeBg('#ffffff', this)" class="aspect-square rounded-md bg-white border-2 border-gray-100 shadow-sm"></button>
                        <button onclick="changeBg('#f9a8d4', this)" class="aspect-square rounded-md bg-[#f9a8d4] border-2 border-white shadow-sm"></button>
                        <button onclick="changeBg('none', this)" class="aspect-square rounded-md bg-gray-50 border-2 border-white shadow-sm flex items-center justify-center text-gray-400">
                            <i class="fas fa-image text-[10px]"></i>
                        </button>
                    </div>
                </div>

                <!-- ตัวปรับความสว่างและ Contrast (แสดงผล Real-time) -->
                <div class="space-y-3 pt-2">
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-[9px] font-bold text-gray-500 uppercase">ความสว่าง</label>
                            <span id="val-bright" class="text-[9px] font-bold text-pink-500">100%</span>
                        </div>
                        <input type="range" id="brightness" min="50" max="150" value="100" class="w-full">
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <label class="text-[9px] font-bold text-gray-500 uppercase">ความคมชัด</label>
                            <span id="val-contrast" class="text-[9px] font-bold text-pink-500">100%</span>
                        </div>
                        <input type="range" id="contrast" min="50" max="150" value="100" class="w-full">
                    </div>
                </div>

                <!-- เลือกขนาดนิ้วที่จะ Export -->
                <div class="pt-2">
                    <label class="text-[9px] font-bold text-gray-400 mb-2 block uppercase">เลือกขนาดรูปที่จะบันทึก</label>
                    <select id="photoSize" class="w-full p-2 bg-pink-50 border border-pink-100 rounded-lg text-[11px] font-medium text-pink-700 outline-none">
                        <option value="1">1 นิ้ว (2.5 x 3.5 ซม.)</option>
                        <option value="1.5">1.5 นิ้ว (3.0 x 4.0 ซม.)</option>
                        <option value="2">2 นิ้ว (4.0 x 5.2 ซม.)</option>
                    </select>
                </div>

                <div class="bg-pink-50 p-2 rounded-lg border border-pink-100 mt-2">
                    <p class="text-[9px] text-pink-600 leading-tight">
                        <i class="fas fa-info-circle mr-1"></i> ตัวปรับแสงจะทำงานแบบเรียลไทม์ เห็นผลทันทีที่หน้าจอกล้องครับ
                    </p>
                </div>
            </div>
        </section>

        <!-- คอลัมน์ที่ 3: แสดงผลลัพธ์และปุ่มดาวน์โหลด -->
        <section class="panel-card">
            <h2 class="section-title"><i class="fas fa-check-circle mr-2"></i> 3. ผลลัพธ์</h2>
            <div class="flex-1 flex flex-col min-h-0">
                <div class="preview-box">
                    <div id="noImage" class="text-center text-pink-200">
                        <i class="fas fa-image text-3xl mb-1 opacity-20"></i>
                        <p class="text-[9px]">ภาพพรีวิว</p>
                    </div>
                    <img id="imageResult" class="hidden" alt="Result">
                </div>
                
                <div class="mt-2">
                    <button id="downloadBtn" disabled class="w-full bg-slate-800 hover:bg-black text-white py-2.5 rounded-lg font-bold text-xs shadow-md disabled:opacity-20 transition-all flex items-center justify-center">
                        <i class="fas fa-download mr-2"></i> บันทึกรูป
                    </button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');
        const snapBtn = document.getElementById('snapBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const imageResult = document.getElementById('imageResult');
        const noImage = document.getElementById('noImage');
        const flash = document.getElementById('flash');
        
        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');

        let activeBgColor = '#003399';
        let isCaptured = false;

        // ฟังก์ชันอัปเดตฟิลเตอร์กล้องสด
        const updateFilters = () => {
            const b = brightnessInput.value;
            const c = contrastInput.value;
            document.getElementById('val-bright').innerText = b + '%';
            document.getElementById('val-contrast').innerText = c + '%';
            canvas.style.filter = `brightness(${b}%) contrast(${c}%)`;
        };

        brightnessInput.oninput = updateFilters;
        contrastInput.oninput = updateFilters;

        window.changeBg = (color, el) => {
            activeBgColor = color;
            document.querySelectorAll('#bgOptions button').forEach(b => b.classList.remove('btn-active'));
            el.classList.add('btn-active');
        };

        // ตั้งค่า AI สำหรับแยกบุคคลออกจากพื้นหลัง
        const selfieSegmentation = new SelfieSegmentation({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
        });

        selfieSegmentation.setOptions({ modelSelection: 1 });

        selfieSegmentation.onResults((results) => {
            if (isCaptured) return;

            ctx.save();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // วาดคน
            ctx.drawImage(results.segmentationMask, 0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'source-in';
            ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

            // วาดพื้นหลัง
            ctx.globalCompositeOperation = 'destination-over';
            if (activeBgColor !== 'none') {
                ctx.fillStyle = activeBgColor;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
            }
            ctx.restore();

            // อัปเดตสถานะ AI
            const status = document.getElementById('cameraStatus');
            if (status.innerText.includes('เตรียม')) {
                status.innerHTML = '<i class="fas fa-check mr-1 text-green-500"></i> AI พร้อมแล้ว';
                status.className = 'text-[9px] font-bold px-3 py-1 bg-green-50 text-green-600 rounded-full border border-green-100';
            }
        });

        // เริ่มต้นการใช้งานกล้อง
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const loop = async () => {
                        if (!isCaptured) await selfieSegmentation.send({image: video});
                        requestAnimationFrame(loop);
                    };
                    loop();
                };
            } catch (err) {
                Swal.fire('กล้องขัดข้อง', 'กรุณาอนุญาตให้เข้าถึงกล้องเพื่อใช้งานระบบครับ', 'error');
            }
        }

        // ระบบถ่ายรูป
        snapBtn.onclick = () => {
            flash.classList.add('animate-flash');
            setTimeout(() => flash.classList.remove('animate-flash'), 300);

            isCaptured = true;

            const finalCanvas = document.createElement('canvas');
            const targetRatio = 3/4;
            const h = canvas.height;
            const w = h * targetRatio;
            const x = (canvas.width - w) / 2;

            finalCanvas.width = 600;
            finalCanvas.height = 800;
            const fCtx = finalCanvas.getContext('2d');
            
            fCtx.filter = canvas.style.filter || 'none';
            fCtx.drawImage(canvas, x, 0, w, h, 0, 0, 600, 800);

            imageResult.src = finalCanvas.toDataURL('image/jpeg', 0.95);
            imageResult.classList.remove('hidden');
            noImage.classList.add('hidden');
            
            snapBtn.classList.add('hidden');
            retakeBtn.classList.remove('hidden');
            downloadBtn.disabled = false;
        };

        retakeBtn.onclick = () => {
            isCaptured = false;
            imageResult.classList.add('hidden');
            noImage.classList.remove('hidden');
            snapBtn.classList.remove('hidden');
            retakeBtn.classList.add('hidden');
            downloadBtn.disabled = true;
        };

        // ระบบดาวน์โหลดรูปภาพตามขนาดที่เลือก
        downloadBtn.onclick = () => {
            const size = document.getElementById('photoSize').value;
            const exportCanvas = document.createElement('canvas');
            let dw, dh;
            
            if(size == "1") { dw = 300; dh = 413; }
            else if(size == "1.5") { dw = 354; dh = 472; }
            else { dw = 472; dh = 614; }

            exportCanvas.width = dw;
            exportCanvas.height = dh;
            const eCtx = exportCanvas.getContext('2d');
            eCtx.drawImage(imageResult, 0, 0, dw, dh);

            const link = document.createElement('a');
            link.download = `id-photo-${size}-inch.jpg`;
            link.href = exportCanvas.toDataURL('image/jpeg', 1.0);
            link.click();
            
            Swal.fire({
                toast: true, position: 'top-end', icon: 'success',
                title: 'บันทึกรูปเรียบร้อย!', showConfirmButton: false, timer: 1500
            });
        };

        window.onload = init;
    </script>
</body>
</html>
